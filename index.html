<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Wurlding - World Builder</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('wurlding:theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
          var m = localStorage.getItem('wurlding:motion');
          if (m !== 'on' && m !== 'off') {
            m = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'on';
          }
          document.documentElement.setAttribute('data-motion', m);
          if (/companion-overlay/i.test(String(location.hash || ''))) {
            document.documentElement.setAttribute('data-companion-overlay', 'true');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
